name: Linux quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  phase-one:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          enable-cache: true
      - name: Install Qt system libraries and media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libegl1 libgl1 libxcb-cursor0 libxkbcommon-x11-0
      - name: Install locked environment
        run: bash scripts/setup-dev.sh
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen pytest
      - run: uv run --frozen python -m novadownloader --smoke-test
      - run: uv build
